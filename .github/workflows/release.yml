name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            rust_target: x86_64-unknown-linux-gnu
            rust_linker: ""
          - arch: arm64
            goarch: arm64
            rust_target: aarch64-unknown-linux-gnu
            rust_linker: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install cross linker
        if: matrix.rust_linker != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu

      - name: Build clashctl
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags="-s -w" -o dist/clashctl-linux-${{ matrix.arch }} ./cmd/clashctl

      - name: Build clash-tui
        working-directory: tui
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.rust_linker }}
        run: |
          cargo build --release --locked --target ${{ matrix.rust_target }}
          cp target/${{ matrix.rust_target }}/release/clash-tui ../dist/clash-tui-linux-${{ matrix.arch }}

      - name: Package artifacts
        run: |
          chmod +x dist/clashctl-linux-${{ matrix.arch }} dist/clash-tui-linux-${{ matrix.arch }}
          tar -C dist -czf clash-for-linux-${{ matrix.arch }}.tar.gz clashctl-linux-${{ matrix.arch }} clash-tui-linux-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: clash-for-linux-${{ matrix.arch }}
          path: clash-for-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    name: Checksums and GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum *.tar.gz | sort -k2 > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: artifacts/SHA256SUMS
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
