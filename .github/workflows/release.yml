name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            rust_target: x86_64-unknown-linux-musl
          - arch: arm64
            goarch: arm64
            rust_target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: taiki-e/install-action@cross

      - name: Build clashctl
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags="-s -w -X main.appVersion=${{ github.ref_name }}" -o dist/clashctl-linux-${{ matrix.arch }} ./cmd/clashctl

      - name: Build clash-tui
        working-directory: tui
        run: |
          cross build --release --locked --target ${{ matrix.rust_target }}
          cp target/${{ matrix.rust_target }}/release/clash-tui ../dist/clash-tui-linux-${{ matrix.arch }}

      - name: Verify portable binaries
        run: |
          file dist/clashctl-linux-${{ matrix.arch }} dist/clash-tui-linux-${{ matrix.arch }}
          if readelf -d dist/clash-tui-linux-${{ matrix.arch }} 2>/dev/null | grep -q 'NEEDED'; then
            echo "clash-tui must not depend on target-system glibc" >&2
            readelf -d dist/clash-tui-linux-${{ matrix.arch }} >&2
            exit 1
          fi

      - name: Package artifacts
        run: |
          chmod +x dist/clashctl-linux-${{ matrix.arch }} dist/clash-tui-linux-${{ matrix.arch }}
          mkdir -p dist/scripts
          cp install.sh dist/install.sh
          cp update.sh dist/scripts/update.sh
          cp uninstall.sh dist/scripts/uninstall.sh
          chmod +x dist/install.sh dist/scripts/update.sh dist/scripts/uninstall.sh
          tar -C dist -czf clash-for-linux-${{ matrix.arch }}.tar.gz clashctl-linux-${{ matrix.arch }} clash-tui-linux-${{ matrix.arch }} install.sh scripts/update.sh scripts/uninstall.sh

      - uses: actions/upload-artifact@v4
        with:
          name: clash-for-linux-${{ matrix.arch }}
          path: clash-for-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    name: Checksums and GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum *.tar.gz | sort -k2 > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: artifacts/SHA256SUMS
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
          make_latest: ${{ (contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta')) && 'false' || 'true' }}
          generate_release_notes: true
          body: |
            This is an automated release for `${{ github.ref_name }}`.

            Release candidates are validation builds. Install them with an explicit release URL:

            ```bash
            TAG=${{ github.ref_name }}
            curl -fL --connect-timeout 10 --max-time 120 \
              -o install.sh \
              "https://gh-proxy.org/https://raw.githubusercontent.com/yequdesu/clash-for-linux/${TAG}/install.sh"
            chmod +x install.sh
            CLASHCTL_RELEASE_TAG="$TAG" bash install.sh --with-tui
            ```

            Uploaded assets include linux amd64/arm64 tarballs and SHA256SUMS.
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
