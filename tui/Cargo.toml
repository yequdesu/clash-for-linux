[package]
name = "clash-tui"
version = "0.1.0"
edition = "2021"
description = "Clash-Terminal TUI dashboard based on Ratatui"

[[bin]]
name = "clash-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
rand = "0.8"

[dev-dependencies]
wiremock = "0.5"
tokio-test = "0.4"
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
